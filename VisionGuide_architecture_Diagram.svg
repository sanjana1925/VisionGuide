<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#0f172a"/>

  <text x="500" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">VisionGuide — System Architecture</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">Real-time object detection, distance estimation, scene recognition &amp; voice feedback</text>

  <!-- Webcam -->
  <rect x="400" y="100" width="200" height="55" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="500" y="133" text-anchor="middle" font-size="15" fill="#e2e8f0">📷 Webcam Feed (OpenCV)</text>

  <line x1="500" y1="155" x2="500" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frame preprocessing -->
  <rect x="370" y="185" width="260" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="500" y="215" text-anchor="middle" font-size="14" fill="#e2e8f0">Frame Capture (BGR → RGB)</text>

  <!-- split arrows -->
  <line x1="500" y1="235" x2="500" y2="255" stroke="#4b5563" stroke-width="2"/>
  <line x1="270" y1="255" x2="730" y2="255" stroke="#4b5563" stroke-width="2"/>
  <line x1="270" y1="255" x2="270" y2="280" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="255" x2="730" y2="280" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- YOLOv5 -->
  <rect x="120" y="280" width="300" height="70" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="270" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#fdba74">🎯 YOLOv5</text>
  <text x="270" y="328" text-anchor="middle" font-size="12" fill="#cbd5e1">Object detection: bounding boxes + class labels</text>

  <!-- Places365 -->
  <rect x="580" y="280" width="300" height="70" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="730" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#d8b4fe">🏞️ Places365 (ResNet18)</text>
  <text x="730" y="328" text-anchor="middle" font-size="12" fill="#cbd5e1">Scene classification: 365 categories</text>

  <!-- Distance estimation -->
  <line x1="270" y1="350" x2="270" y2="385" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="385" width="300" height="60" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="270" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#fdba74">📏 Distance Estimation</text>
  <text x="270" y="428" text-anchor="middle" font-size="11" fill="#cbd5e1">Pinhole approximation (known height × focal length)</text>

  <!-- Speech queue -->
  <line x1="270" y1="445" x2="270" y2="475" stroke="#4b5563" stroke-width="2"/>
  <line x1="730" y1="350" x2="730" y2="475" stroke="#4b5563" stroke-width="2"/>
  <line x1="270" y1="475" x2="500" y2="475" stroke="#4b5563" stroke-width="2"/>
  <line x1="730" y1="475" x2="500" y2="475" stroke="#4b5563" stroke-width="2"/>
  <line x1="500" y1="475" x2="500" y2="495" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="495" width="340" height="55" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="520" text-anchor="middle" font-size="14" font-weight="600" fill="#86efac">🔊 Speech Queue (cooldown-limited)</text>
  <text x="500" y="538" text-anchor="middle" font-size="11" fill="#cbd5e1">Avoids repeating the same announcement every frame</text>

  <line x1="400" y1="550" x2="250" y2="580" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="550" x2="750" y2="580" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <rect x="80" y="580" width="340" height="40" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="250" y="605" text-anchor="middle" font-size="13" fill="#e2e8f0">🖥️ Live Video Overlay (boxes, distance, scene)</text>

  <rect x="580" y="580" width="340" height="40" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="750" y="605" text-anchor="middle" font-size="13" fill="#e2e8f0">🗣️ Spoken Audio Output (pyttsx3)</text>
</svg>
